# Single source of truth for dependency versions. Referenced from
# app/build.gradle.kts as libs.androidx.core.ktx and so on.
[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
coil = "2.7.0"
documentfile = "1.0.1"
jna = "5.15.0"
# Network storage. All four are plain Java with no native code, which is the
# reason for choosing them: anything with a .so would need cross-compiling for
# every ABI and could not be checked without a device.
commonsNet = "3.11.1"
sshj = "0.38.0"
smbj = "0.14.0"
ftpserver = "1.2.1"
okhttp = "4.12.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
# Coil cannot decode a video frame on its own; this adds the decoder that
# makes video thumbnails possible at all.
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
# UniFFI's Kotlin bindings call into the .so through JNA, so this is required
# by the generated code -- the @aar variant is the one that works on Android.
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# FTP, and FTPS, for network storage.
commons-net = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }
# SFTP - file transfer over SSH, not FTP with TLS.
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
# SMB2/SMB3, for Windows shares and most NAS boxes. SMB1 is not supported by
# this library and is not wanted.
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }
# The built-in FTP server. ftplet-api carries the interfaces it is configured
# through, and is a separate artifact from the server itself.
ftpserver-core = { group = "org.apache.ftpserver", name = "ftpserver-core", version.ref = "ftpserver" }
ftplet-api = { group = "org.apache.ftpserver", name = "ftplet-api", version.ref = "ftpserver" }
# WebDAV is spoken directly over HTTP rather than through a WebDAV library.
# Coil already pulls this in; declared explicitly because code here calls it.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
# An HTTP server for the WebDAV test. The JDK has one, but com.sun.net.httpserver
# is not on Android's compile classpath, so a unit test using it compiles on a
# desktop and fails in the build.
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
