[package]
name = "filemanager-core"
version = "0.1.0"
edition = "2021"
authors = ["techonar"]
rust-version = "1.77"

[lib]
# cdylib -> the .so that Android loads. staticlib/rlib let us run `cargo test` natively.
name = "filemanager_core"
crate-type = ["cdylib", "rlib"]

# Generates the Kotlin bindings from the compiled library. Invoked by Gradle.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "2"
walkdir = "2"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Deliberately NOT set here:
#
#   strip = "symbols"
#     uniffi-bindgen's --library mode reads the UNIFFI_META_* symbols out of
#     the compiled .so to discover the interface. Stripping removes .symtab
#     (.dynsym survives, since linking needs it) and the bindgen then finds no
#     components, writes no Kotlin, and still exits 0 - so the build fails far
#     downstream with "Unresolved reference 'uniffi'". AGP strips the .so when
#     it packages the APK anyway, so nothing is gained by stripping here.
#
#   panic = "abort"
#     uniffi catches Rust panics at the FFI boundary and turns them into a
#     Kotlin exception. With panic=abort a panic takes down the whole app
#     process instead, which for filesystem work is a real robustness loss.
