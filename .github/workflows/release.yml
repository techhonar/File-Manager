name: Release APK

# Tagging v1.2.3 builds, signs and publishes a release APK.
# The workflow file must exist in the commit the tag points at, so merge this
# to main before tagging.
on:
  push:
    tags:
      # Both spellings, because "0.1.3" is at least as natural to type as
      # "v0.1.3" and a tag that silently triggers nothing is a bad surprise.
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.1.3'
        required: true
        default: '0.1.0'
      publish:
        description: 'Publish a GitHub Release (creates the tag if needed)'
        required: false
        type: boolean
        default: true

# Needed to create the GitHub Release and upload the APK to it.
permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      # "Re-run jobs" replays the SHA recorded when the run was created, so by
      # default a re-run rebuilds the same code however many times you press
      # it - it exists to retry flaky infrastructure, not to pick up fixes.
      #
      # For a manual run that is rarely what is wanted, so check out the tip of
      # the dispatched branch by name instead: a re-run then builds whatever
      # that branch points at now.
      #
      # Tag builds keep the pinned SHA. A release must be reproducible from its
      # tag, and quietly shipping different code under an existing version
      # would be far worse than the inconvenience this avoids.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.sha }}
          # The default is a shallow clone of one commit with no tags, which
          # leaves nothing to write a changelog from. The repository is small
          # enough that fetching all of it costs a couple of seconds.
          fetch-depth: 0

      # Record what was actually built. Which commit a run used has been
      # genuinely confusing, and with the checkout above a re-run may well
      # build something newer than the SHA shown in the run header.
      - name: Report the commit being built
        id: commit
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "Building $SHA"
          git log -1 --format='  %h  %s'

      # ---- Version -------------------------------------------------------
      # v1.2.3 -> versionName 1.2.3. versionCode must increase every release,
      # so it uses the monotonic run number rather than the tag.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v$VERSION"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION as tag $TAG (code ${{ github.run_number }})"

      # ---- Toolchains ----------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools". Google retired the
          # "tools" package and removed it from the SDK repository, so
          # sdkmanager now exits 1 on it and takes the whole action down with
          # it - "Failed to find package 'tools'", then nothing else in the job
          # runs. Nothing here ever used it: the build needs platforms and
          # build-tools, which Gradle resolves itself.
          packages: platform-tools

      # cargo-ndk needs ANDROID_NDK_HOME. Runners ship an NDK, but do not
      # rely on it being there - fall back to installing a pinned one.
      - name: Locate or install the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "No preinstalled NDK found; installing $NDK_VERSION"
            sdkmanager --install "ndk;$NDK_VERSION"
            NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          fi
          echo "Using NDK at $NDK"
          # Set both: cargo-ndk warns loudly when the two disagree, and the
          # runner presets ANDROID_NDK_ROOT to a different version.
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
        env:
          NDK_VERSION: '27.2.12479018'

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ~/.cargo/bin is restored by the cache above, so cargo-ndk is usually
      # already there - and `cargo install` exits 101 ("binary already exists
      # in destination") rather than succeeding, which kills the job before it
      # reaches any real work. Check first, and --force only when a binary of
      # the wrong major version is in the way.
      - name: Install cargo-ndk
        run: |
          if cargo-ndk --version 2>/dev/null | grep -qE '^cargo-ndk 3\.'; then
            echo "Using cached $(cargo-ndk --version)"
          else
            cargo install cargo-ndk --locked --version '^3' --force
          fi

      # ---- Verify the Rust core before shipping it -----------------------
      - name: Test Rust core
        working-directory: rust-core
        run: cargo test --locked

      # ---- Signing -------------------------------------------------------
      # Decodes the keystore from secrets. If KEYSTORE_BASE64 is not set the
      # build still runs and produces an unsigned APK, so a fork without
      # secrets is not a hard failure.
      # An unsigned APK cannot be installed at all - Android rejects it with
      # "package appears to be invalid" - so never produce one. With the real
      # keystore we sign for release; without it we mint a throwaway key so the
      # build is still installable for testing.
      - name: Prepare signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key from secrets."
          else
            # A tag means "publish this". Publishing something signed with a
            # key that changes every run is worse than not publishing, and
            # skipping the release quietly just leaves an empty Releases page
            # with no explanation - so refuse here, where the reason is clear.
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
              echo "::error::Cannot publish a release: KEYSTORE_BASE64 is not set."
              echo "::error::Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and"
              echo "::error::KEY_PASSWORD under Settings -> Secrets and variables ->"
              echo "::error::Actions, then delete and re-push this tag."
              exit 1
            fi
            echo "::warning::KEYSTORE_BASE64 is not set - signing with a throwaway key. \
          The APK installs for testing, but the key differs every run, so each \
          install must uninstall the previous one first. Not for distribution."
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias filemanager \
              -keyalg RSA -keysize 2048 -validity 365 \
              -storepass throwaway -keypass throwaway \
              -dname "CN=File Manager Throwaway, O=File Manager, C=US" >/dev/null 2>&1
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
          fi
          test -s "$KS" || { echo "::error::No keystore was produced"; exit 1; }

      # ---- Build ---------------------------------------------------------
      # Gradle is invoked directly rather than through ./gradlew: the wrapper
      # JAR is a binary that is not committed. Pin the version here so CI and
      # local builds agree.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.kind == 'release' && secrets.KEYSTORE_PASSWORD || 'throwaway' }}
          KEY_ALIAS: ${{ steps.keystore.outputs.kind == 'release' && secrets.KEY_ALIAS || 'filemanager' }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.kind == 'release' && secrets.KEY_PASSWORD || 'throwaway' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # The protocol clients and the built-in server, tested against each
      # other. They are plain JVM tests - no device, no emulator - and they run
      # before the APK is published rather than after someone installs it.
      - name: Run the unit tests
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Keep the test report when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      # Runs even when the build fails, so a bindings problem is visible in
      # the log instead of having to be inferred from Kotlin errors.
      - name: Show generated Rust output
        if: always()
        run: |
          echo "--- native libs ---"
          find app/build/generated/jniLibs -name '*.so' 2>/dev/null | sed 's/^/  /' || echo "  (none)"
          echo "--- generated Kotlin bindings ---"
          find app/build/generated/uniffi -name '*.kt' 2>/dev/null | sed 's/^/  /' || echo "  (none)"
          BINDINGS=$(find app/build/generated/uniffi -name '*.kt' 2>/dev/null | head -1)
          if [ -n "$BINDINGS" ]; then
            echo "--- first lines of $BINDINGS ---"
            head -5 "$BINDINGS"
          else
            echo "::warning::No Kotlin bindings were generated"
          fi

      - name: Collect the APK
        id: apk
        run: |
          # AGP names the output app-release.apk when signed and
          # app-release-unsigned.apk otherwise.
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          # A signed APK must carry an APK Signing Block. Verify rather than
          # trust the filename: shipping an uninstallable APK is worse than
          # failing the build.
          if ! unzip -l "$APK" | grep -q . ; then
            echo "::error::APK is not a readable archive"; exit 1
          fi
          case "$APK" in
            *-unsigned.apk)
              echo "::error::AGP produced an unsigned APK - the signing config did not apply"
              exit 1 ;;
          esac
          SUFFIX=""
          [ "${{ steps.keystore.outputs.kind }}" = "throwaway" ] && SUFFIX="-testkey"
          NAME="FileManager-${{ steps.version.outputs.name }}${SUFFIX}.apk"
          mv "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          # The release notes quote both of these and tell the reader to check
          # a failed install against them. They were referenced there before
          # anything set them, so every release so far published an empty size
          # and an empty hash - the one check we offered for a truncated
          # download did not exist.
          echo "sha=$(sha256sum "$NAME" | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$NAME")" >> "$GITHUB_OUTPUT"
          echo "Built $NAME ($(du -h "$NAME" | cut -f1))"

      # Everything here is what a device checks before it will install, and
      # every one of them has to be right or the phone says only "There was a
      # problem parsing the package" - which names none of them. Checking on
      # the runner turns a failed install on someone's phone into a failed
      # build we can read.
      - name: Check the APK is installable
        run: |
          python3 - "${{ steps.apk.outputs.path }}" <<'EOF'
          import struct, sys, zipfile

          apk = sys.argv[1]
          blob = open(apk, "rb").read()
          zf = zipfile.ZipFile(apk)
          problems = []

          def data_start(hdr):
              # The central directory's extra field is not the local header's,
              # and it is the local one that zipalign pads. Reading the central
              # copy reports every entry as misaligned.
              n, e = struct.unpack_from("<HH", blob, hdr + 26)
              return hdr + 30 + n + e

          for info in zf.infolist():
              off = data_start(info.header_offset)
              if info.filename.endswith(".so"):
                  if info.compress_type != 0:
                      problems.append(f"{info.filename} is compressed")
                  elif off % 4096:
                      problems.append(f"{info.filename} not page aligned ({off % 4096})")
              elif info.filename == "resources.arsc":
                  if info.compress_type != 0:
                      problems.append("resources.arsc is compressed")
                  elif off % 4:
                      problems.append(f"resources.arsc not 4-byte aligned ({off % 4})")

          # Signature schemes, read straight out of the APK Signing Block.
          names = {0x7109871a: "v2", 0xf05368c0: "v3", 0x1b93ad61: "v3.1"}
          eocd = blob.rfind(b"PK\x05\x06")
          cd = struct.unpack_from("<I", blob, eocd + 16)[0]
          found = []
          if blob[cd - 16:cd] == b"APK Sig Block 42":
              size = struct.unpack_from("<Q", blob, cd - 24)[0]
              p = cd - 8 - size + 8
              while p < cd - 24:
                  ln = struct.unpack_from("<Q", blob, p)[0]
                  pid = struct.unpack_from("<I", blob, p + 8)[0]
                  if pid in names:
                      found.append(names[pid])
                  p += 8 + ln
          else:
              problems.append("no APK Signing Block - the APK is not v2+ signed")
          if any(n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC"))
                 for n in zf.namelist()):
              found.insert(0, "v1")

          print("signature schemes:", ", ".join(found) or "NONE")
          print("entries:", len(zf.namelist()))
          print("abis:", sorted({n.split("/")[1] for n in zf.namelist()
                                 if n.startswith("lib/")}))

          if problems:
              for m in problems:
                  print(f"::error::{m}")
              sys.exit(1)
          print("APK structure is installable")
          EOF

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ---- Publish -------------------------------------------------------
      # Only for tag pushes; a manual run leaves the APK as an artifact.
      #
      # Done with the gh CLI rather than an action. softprops/action-gh-release
      # created the release and then failed on the upload with "Error creating
      # asset temp dir", leaving a release with no APK in it - the empty-release
      # failure this workflow has already been through twice. It is also a
      # floating major tag, so it changes underneath us, which is how the SDK
      # setup broke as well. gh is preinstalled on the runner and every step
      # below says plainly what it is doing.
      - name: Publish GitHub Release
        id: publish
        if: >-
          (github.event_name == 'push' || inputs.publish)
          && steps.keystore.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          SHA256: ${{ steps.apk.outputs.sha }}
          SIZE: ${{ steps.apk.outputs.size }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # --- What changed -------------------------------------------------
          #
          # Built by tools/release_notes.py, which groups the commits by the
          # branch each was merged from and quotes the reasoning out of their
          # messages. It is a script in the repository rather than shell here
          # so that it can be run and read on its own.
          #
          # No pipelines: this runs under pipefail, where `git tag | head`
          # fails the whole step when head closes the pipe early.
          PREVIOUS=""
          for candidate in $(git tag --sort=-v:refname --list 'v*'); do
            if [ "$candidate" != "$TAG" ]; then
              PREVIOUS="$candidate"
              break
            fi
          done
          echo "Previous release: ${PREVIOUS:-none}"

          python3 tools/release_notes.py \
            "$PREVIOUS" "$TAG" "$SERVER" "$REPO" > release-notes.md

          cat >> release-notes.md <<NOTES
          **SHA-256:** \`$SHA256\`

          **Size:** $SIZE bytes

          ## Install

          Download the APK below and open it on your phone. You will need to
          allow installing from unknown sources.

          If the install fails with *"There was a problem parsing the
          package"*, the download was almost certainly truncated - check the
          file size against the figure above and download it again.

          Requires **Android 11 (API 30)** or newer, on an **arm64** device.
          An older phone reports this as a parsing error rather than a
          version mismatch, so check the Android version first if the
          install fails.

          After first launch the app asks for *All files access*, which it
          needs to browse and search storage. Grant it in the Settings page
          that opens, then return to the app.
          NOTES

          # A pre-release is anything whose version carries a suffix, such as
          # 0.3.0-beta1.
          PRERELEASE=""
          case "$NAME" in *-*) PRERELEASE="--prerelease" ;; esac

          # Created or updated, so a re-run after a failed upload finishes the
          # job rather than stopping because the release already exists - which
          # is exactly the state the last run left behind.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating it."
            gh release edit "$TAG" \
              --title "File Manager $NAME" \
              --notes-file release-notes.md \
              --draft=false
          else
            echo "Creating release $TAG."
            # shellcheck disable=SC2086
            gh release create "$TAG" \
              --title "File Manager $NAME" \
              --notes-file release-notes.md \
              $PRERELEASE
          fi

          echo "Uploading $APK"
          gh release upload "$TAG" "$APK" --clobber

          # The whole point of this step. A release with no APK in it looks
          # like success from the run page and is useless to anyone following
          # the link, so it is checked rather than assumed.
          echo "Verifying the asset is attached"
          ATTACHED=$(gh release view "$TAG" --json assets \
            --jq '.assets[].name' | tr '\n' ' ')
          echo "Assets: $ATTACHED"
          case "$ATTACHED" in
            *"$APK"*) echo "Published $APK to $TAG" ;;
            *)
              echo "::error::The release was created but $APK is not attached to it."
              exit 1 ;;
          esac

      # Writes a panel at the top of the run page. Whether a release was
      # published has been non-obvious three times now; this states it
      # outright rather than leaving it to be inferred from a skipped step.
      - name: Summarise what this run produced
        if: always()
        run: |
          {
            echo "## File Manager ${{ steps.version.outputs.name }}"
            echo ""
            echo "Built from \`${{ steps.commit.outputs.short }}\` - ${{ steps.commit.outputs.subject }}"
            echo ""
            if [ ! -f "${{ steps.apk.outputs.path }}" ]; then
              echo "**No APK was produced** - the build failed before packaging."
              echo ""
              echo "Check the failed step above for the reason."
              exit 0
            fi
            echo "**APK:** \`${{ steps.apk.outputs.path }}\`"
            echo ""
            if [ "${{ steps.keystore.outputs.kind }}" = "release" ]; then
              echo "Signed with the release key from repository secrets."
            else
              echo "Signed with a **throwaway key** - installable for testing, but the"
              echo "key changes every run, so each install must uninstall the previous"
              echo "one first."
            fi
            echo ""
            # Reads what the publish step actually did, not what was asked
            # for. This said "Published as a release" while the upload was
            # failing, which is the most misleading thing it could have said:
            # the link it printed led to a release with no APK in it.
            case "${{ steps.publish.outcome }}" in
              success)
                echo "Published as a release: <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}>"
                ;;
              failure)
                echo "**Publishing failed.** The APK was built and is attached to"
                echo "this run as an artifact, but the release does not have it."
                echo "See the Publish step above."
                ;;
              *)
                echo "**Not published as a release.** This was a manual run with"
                echo "*Publish a GitHub Release* unticked, so the APK is attached to this"
                echo "run as a build artifact instead - see the Artifacts section below."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
